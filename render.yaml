services:
  # ===========================================================================
  # Backend Web Service (FastAPI + Python 3)
  # ===========================================================================
  - type: web
    name: smartcart-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: smartcart-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*"

  # ===========================================================================
  # Frontend Static Site (HTML5 / CSS3 / Vanilla JS)
  # ===========================================================================
  - type: static_site
    name: smartcart-frontend
    rootDir: frontend
    publishDir: .
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ===========================================================================
# Managed PostgreSQL Database (Optional / Automatic via Render Blueprint)
# ===========================================================================
databases:
  - name: smartcart-db
    plan: free
    databaseName: smartcart
    user: smartcart_user
